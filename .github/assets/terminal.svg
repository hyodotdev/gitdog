<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" role="img" aria-labelledby="title description">
  <title id="title">Gitdog in your terminal</title>
  <desc id="description">The front-facing Gitdog mascot in terminal text beside commands to sign in, connect a GitHub repository, configure automation and review pending tickets.</desc>
  <style>
    text { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .command { font-size: 17px; fill: #f5f5f5; }
    .prompt { fill: #8b949e; }
    .note { font-size: 12px; fill: #8b949e; }
  </style>
  <rect width="960" height="506" fill="#0c0e11"/>
  <rect x=".5" y=".5" width="959" height="505" fill="none" stroke="#30363d"/>
