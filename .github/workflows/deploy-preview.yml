name: Deploy on preview
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "firebase.json"
      - ".firebaserc"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "postcss.config.js"
      - "tsconfig.json"
      - ".github/scripts/**"
      - ".github/workflows/deploy-preview.yml"
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Dependabot pull requests do not receive the hosting secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Verify frontend runtime configuration
        shell: bash
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_DEV_URL }}
        run: |
          set -euo pipefail
          if ! DEPLOY_URL_TO_VALIDATE="$VITE_CONVEX_URL" bun run .github/scripts/validateDeployUrl.ts; then
            echo "::error::VITE_CONVEX_URL must exactly match a public HTTPS origin without a trailing slash."
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_DEV_URL }}
          VITE_GITHUB_APP_SLUG: gitdogbot-dev

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODEYOU_DF251 }}
          projectId: codeyou-df251
