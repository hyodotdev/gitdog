name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: node scripts/release.mjs check
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
        env:
          GITDOG_TEST_DIR: ${{ runner.temp }}/gitdog-tests
      - run: bun audit --production
      - run: npm pack
      - name: Smoke-test the exact npm archive
        shell: bash
        run: |
          set -euo pipefail
          archive="gitdog-$(node -p "require('./package.json').version").tgz"
          npm install --prefix "$RUNNER_TEMP/gitdog-smoke" --ignore-scripts "./$archive"
          "$RUNNER_TEMP/gitdog-smoke/node_modules/.bin/gitdog" --version
          "$RUNNER_TEMP/gitdog-smoke/node_modules/.bin/gitdog" --json api list > "$RUNNER_TEMP/catalog.json"
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.ok(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/catalog.json')).length >= 86)"
          sha512sum "$archive" > release.sha512
      - name: Run the exact archive through npx without a global install
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")"
          actual="$(npx --yes --package "$GITHUB_WORKSPACE/gitdog-$version.tgz" gitdog --version)"
          test "$actual" = "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            gitdog-*.tgz
            release.sha512
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - run: sha512sum --check release.sha512
      - run: node scripts/release.mjs publish
