name: Flaky test check

# Repeats the suites with shuffled order on GitHub runners, so timing- or
# order-dependent tests show up here instead of failing main after a merge.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run the web suite 5 times in shuffled order
        run: |
          for run in 1 2 3 4 5; do
            bunx vitest run --sequence.shuffle --sequence.seed="$RANDOM"
          done

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 24.18.0, 26.13.0]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run the CLI suite 10 times
        run: |
          for run in $(seq 1 10); do
            GITDOG_TEST_DIR="$RUNNER_TEMP/gitdog-tests-$run" node --test test/*.test.mjs
          done
