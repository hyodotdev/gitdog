<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      /* Prevent flash of unstyled content - sync with system preference */
      html {
        background-color: #f5f5f5;
      }
      html.dark {
        background-color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          background-color: #1a1a1a;
        }
      }
      body {
        background-color: transparent;
      }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary Meta Tags -->
    <title>Gitdog - AI GitHub Assistant</title>
    <meta name="title" content="Gitdog - AI GitHub Assistant" />
    <meta
      name="description"
      content="AI assistant for GitHub issues and discussions. Get intelligent answers based on your codebase context."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gitdog.dev/" />
    <meta property="og:title" content="Gitdog - AI GitHub Assistant" />
    <meta
      property="og:description"
      content="AI assistant for GitHub issues and discussions. Get intelligent answers based on your codebase context."
    />
    <meta property="og:image" content="https://gitdog.dev/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://gitdog.dev/" />
    <meta property="twitter:title" content="Gitdog - AI GitHub Assistant" />
    <meta
      property="twitter:description"
      content="AI assistant for GitHub issues and discussions. Get intelligent answers based on your codebase context."
    />
    <meta property="twitter:image" content="https://gitdog.dev/og-image.png" />

    <!-- JSON-LD Structured Data for AEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gitdog",
        "url": "https://gitdog.dev",
        "logo": "https://gitdog.dev/icon.svg",
        "description": "AI-powered assistant for GitHub repositories. Automates issue responses and discussion replies with intelligent codebase-aware answers.",
        "sameAs": ["https://github.com/hyodotdev"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "url": "https://gitdog.dev/contact"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Gitdog",
        "url": "https://gitdog.dev",
        "description": "AI-powered assistant for GitHub repositories. Automates issue responses and discussion replies with intelligent codebase-aware answers.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://gitdog.dev/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Gitdog",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://gitdog.dev",
        "description": "AI-powered assistant for GitHub repositories. Automates issue responses and discussion replies with intelligent codebase-aware answers.",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD",
            "description": "100,000 tokens per month with a hard limit and prepaid token packs available for additional usage"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "9.99",
            "priceCurrency": "USD",
            "description": "2.4M tokens per month with prepaid token packs for additional usage and no automatic overage charges"
          }
        ],
        "featureList": [
          "Issue Automation",
          "Discussion Assistant",
          "Context-Aware Answers",
          "Codebase Indexing",
          "All Programming Languages"
        ],
        "screenshot": "https://gitdog.dev/og-image.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
